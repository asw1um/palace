<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="Palace — track what you watch, build lists, and share them with your clubs." />
    <title>Palace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var raw = localStorage.getItem('palace.theme.v1');
        if (raw) {
          var t = JSON.parse(raw);
          var el = document.documentElement;
          if (t.mode) el.dataset.mode = t.mode === 'system'
            ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : t.mode;
          if (t.surface) el.dataset.surface = t.surface;
          if (t.density) el.dataset.density = t.density;
          if (t.accent) el.style.setProperty('--accent', t.accent);
        } else {
          document.documentElement.dataset.mode = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
