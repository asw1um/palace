name: Deploy Dev

on:
  push:
    branches: [dev]

jobs:
  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m compileall backend/ -q -x NOGITCOMMIT

      - name: Check imports
        working-directory: backend
        run: python -c "import main"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/palace-dev
            git pull origin dev
            source venv/bin/activate
            pip install -r requirements.txt -q
            cd frontend
            npm ci --silent
            npm run build
            cd ..
            cd backend
            python -c "from models.database import Base, init_db; import os; e = init_db('sqlite:///instance/users.db'); Base.metadata.create_all(bind=e)"
            python -c "
import sqlite3
conn = sqlite3.connect('instance/users.db')
migrations = [
    'ALTER TABLE reviews ADD COLUMN is_spoiler BOOLEAN NOT NULL DEFAULT 0',
]
for sql in migrations:
    try:
        conn.execute(sql)
        conn.commit()
    except Exception:
        pass
conn.close()
"
            cd ..
            sudo systemctl restart palace-dev
            echo "Deploy complete"
