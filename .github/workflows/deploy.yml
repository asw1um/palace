name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/palace
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt -q
            cd frontend
            npm ci --silent
            npm run build
            cd ..
            python -c "
            import sys, os
            sys.path.insert(0, '/var/www/palace/backend')
            os.chdir('/var/www/palace/backend')
            from app import app, db
            with app.app_context():
                db.create_all()
            "
            sudo systemctl restart palace_backend
            echo "Deploy complete"
